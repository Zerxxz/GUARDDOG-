version: "3.8"

services:
  trap:
    build: .
    command: python -m sentinel.trap watch --loop
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./decoys:/app/decoys
      - ./keys:/app/keys:ro
      - events:/app/sentinel
    ports: [] # no inbound

  api:
    build: .
    command: uvicorn sentinel.api:app --host 0.0.0.0 --port 8080
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./decoys:/app/decoys
      - events:/app/sentinel
    ports:
      - "127.0.0.1:8080:8080" # localhost only — put behind a reverse proxy

  guardd: # Leash signing daemon placeholder (T8+ path, owner-triggered)
    build: .
    command: python -m leash.cli watch --loop
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./decoys:/app/decoys
      - ./keys:/app/keys:ro
      - events:/app/sentinel

volumes:
  events:

  bait-rpc:
    build: .
    command: uvicorn sentinel.bait_rpc:app --host 0.0.0.0 --port 8545
    restart: unless-stopped
    env_file: .env
    volumes:
      - events:/app/sentinel
    ports:
      - "8545:8545" # PUBLIC — this is the bait, it must be reachable
