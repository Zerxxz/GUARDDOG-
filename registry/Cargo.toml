[package]
name = "guarddog-registry"
version = "0.1.0"
edition = "2021"
description = "GUARDDOG Sentinel Registry — on-chain threat-intel verdicts anchored by NEAR Chain Signatures (MPC)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.1"
borsh = "1"
schemars = "0.8"
# Recovery is implemented directly on k256 arithmetic (near/mpc check_ec_signature
# math) so the `ecdsa` feature is not needed. no-std + critical-section keeps
# rand_core's getrandom (which cannot compile on wasm32-unknown-unknown) out of
# the wasm build; the std flavor below is only used for native unit tests.
[target.'cfg(target_arch = "wasm32")'.dependencies]
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "critical-section"] }
sha3 = { version = "0.10", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "precomputed-tables", "std"] }
sha3 = "0.10"
hex = "0.4"

[dev-dependencies]
# unit-testing feature drives the near-sdk VM mock used by #[cfg(test)]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
